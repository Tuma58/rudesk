# Конфигурация источника ЭТОГО репозитория (не upstream RustDesk).
# Нужна только если install.sh запускают через curl|bash без локального клона.
# После публикации на GitHub раскомментируйте и подставьте владельца:
#
# RUDESK_ARCHIVE_URL="https://github.com/<owner>/rudesk/archive/refs/heads/main.tar.gz"
#
# Рекомендуемая однострочная установка из README не требует curl|bash:
# скачивает архив этого репозитория и запускает install.sh из него.

RUDESK_ARCHIVE_URL="${RUDESK_ARCHIVE_URL:-}"
